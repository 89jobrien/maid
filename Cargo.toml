[package]
name = "filemaid"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A clean, fast CLI tool that organises files into subfolders by type, converts documents to markdown, and routes them to Obsidian vaults"
license = "MIT"
readme = "README.md"
repository = "https://github.com/89jobrien/maid"
homepage = "https://github.com/89jobrien/maid"
keywords = ["files", "organize", "obsidian", "markdown", "cli"]
categories = ["command-line-utilities", "filesystem"]

# The crates.io package is `filemaid`, but the installed command stays `maid`.
[[bin]]
name = "maid"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
dirs = "6.0"
chrono = "0.4"
